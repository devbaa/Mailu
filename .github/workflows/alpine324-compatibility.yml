name: Alpine 3.24 compatibility (diagnostic only)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Image to build without publishing
        required: true
        type: choice
        default: base
        options:
          - base
          - front
          - imap
          - webmail
          - smtp
          - antispam
          - admin
          - resolver
          - default

permissions:
  contents: read

jobs:
  build:
    name: Diagnostic build - ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Report selected base and target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          echo "Target: $TARGET"
          echo "Base: ghcr.io/mailu/alpine:3.24.3"
          echo "Diagnostic build only; no push or registry promotion"
      - name: Build candidate with Alpine 3.24
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          docker buildx bake \
            -f tests/build.hcl \
            --set 'base.args.DISTRO=ghcr.io/mailu/alpine:3.24.3' \
            "$TARGET"
